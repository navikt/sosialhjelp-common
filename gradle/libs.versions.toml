[versions]
kotlin = "2.4.10"
ktlint = "1.8.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.6.2"
kotlinx-coroutines = "1.10.1"
sosialhjelp-filformat-kmp = "1.20260909.60"
mockk = "1.14.9"
assertj = "3.27.7"
js-joda-timezone = "2.23.0"
junit-jupiter = "6.1.3"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
sosialhjelp-filformat-kmp = { module = "no.nav.sosialhjelp.filformat:soknadsosialhjelp-filformat-kmp", version.ref = "sosialhjelp-filformat-kmp" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.0.1" }
