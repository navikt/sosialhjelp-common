name: Publish Release
on:
  release:
    types: [published]

jobs:
  publish:
    name: Test and Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ORG_GRADLE_PROJECT_githubUser: x-access-token
      ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve version from release tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build, test, and publish Maven packages
        run: ./gradlew build publish -Pversion=$VERSION
      - name: Build JS library distribution
        run: ./gradlew :digisos-hendelser:jsNodeProductionLibraryDistribution -Pversion=$VERSION
      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@navikt'
          package-manager-cache: false
      - name: Publish npm package
        working-directory: digisos-hendelser/build/dist/js/productionLibrary
        run: |
          npm pkg set name='@navikt/digisos-hendelser'
          npm pkg set version="$VERSION"
          npm pkg set repository.type=git
          npm pkg set repository.url='https://github.com/navikt/sosialhjelp-common.git'
          npm publish
